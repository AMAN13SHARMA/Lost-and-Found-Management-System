<article class="item-card">
  <a class="item-card-link" href="{{ item.get_absolute_url }}" aria-label="View {{ item.title }}">
    <div class="item-thumb">
      {% if item.photo %}
        <img src="{{ item.photo.url }}" alt="Photo of {{ item.title }}" loading="lazy">
      {% else %}
        <span class="item-thumb-icon" aria-hidden="true">{{ item.category_icon }}</span>
      {% endif %}
      <span class="tag tag-{{ item.report_type|lower }}">{{ item.get_report_type_display }}</span>
    </div>
    <div class="item-body">
      <h3 class="item-title">{{ item.title }}</h3>
      <p class="item-meta"><span aria-hidden="true">🏷️</span> {{ item.category }}</p>
      <p class="item-meta"><span aria-hidden="true">📍</span> {{ item.location|truncatechars:38 }}</p>
      <div class="item-foot">
        <span class="muted small">{{ item.date_lost_found|date:"d M Y" }}</span>
        <span class="badge badge-{{ item.status_css }}">{{ item.get_status_display }}</span>
      </div>
    </div>
  </a>
</article>
